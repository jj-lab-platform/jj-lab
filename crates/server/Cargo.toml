[package]
name = "jjlab-server"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "jjlab"
path = "src/main.rs"

[dependencies]
jjlab-core = { path = "../core" }
jjlab-proto = { path = "../proto" }
jjlab-git = { path = "../git" }

# pkglab: in-process package registry (OCI + protocol adapters)
pkglab-common.workspace = true
pkglab-core.workspace = true
pkglab-oci.workspace = true
pkglab-generic.workspace = true
pkglab-helm.workspace = true
pkglab-go.workspace = true
pkglab-maven.workspace = true
pkglab-pypi.workspace = true
pkglab-composer.workspace = true
pkglab-npm.workspace = true
pkglab-nuget.workspace = true
pkglab-rubygems.workspace = true
pkglab-pub.workspace = true
pkglab-hex.workspace = true
pkglab-cargo.workspace = true
pkglab-swift.workspace = true
pkglab-conan.workspace = true

axum.workspace = true
tokio.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prost.workspace = true
base64.workspace = true
http.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
pollster = "1.0"
include_dir.workspace = true
rustls.workspace = true
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
